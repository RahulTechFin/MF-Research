name: Daily Data Update

# Pulls the latest NAVs from api.mfapi.in, runs the calculation engine inside
# the runner, publishes the ~6 MB JSON the dashboard reads, and throws the
# database away. Nothing is stored between runs — no Release asset, no
# committed database.

# ONE RUN A DAY, ONE DEPLOY.
#
# There used to be a second cron at 08:15 IST as a catch-up. It committed too
# whenever more funds had reported overnight, so Netlify rebuilt twice a day for
# the same day's data. Now there is a single run and a single deploy; if it
# fails, re-run it from the Actions tab rather than waiting for a second cron.
#
# 23:45 IST is chosen because both upstreams are settled by then:
#   AMFI/mfapi publish the day's NAVs by ~23:00 IST  (verified: the 23:45 run
#     picked up as_of 2026-07-30 on 2026-07-30)
#   NSE closes 15:30 IST, so Yahoo's daily bar is 8h old  (verified: 2026-07-31
#     closes were available by 19:39 IST)
#
# Asking earlier risks storing an intraday index value as if it were a close.
on:
  schedule:
    # 23:45 IST = 18:15 UTC
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      max_staleness:
        description: 'Max age (days) of the newest NAV before the run aborts'
        required: false
        default: '6'
      skip_indices:
        description: 'Skip the Yahoo Finance index refresh'
        required: false
        default: 'false'

concurrency:
  group: daily-update
  cancel-in-progress: false

# The benchmark index history is pulled from Supabase Storage by
# scripts/index_store (via build_db_from_api). Without these the run still
# works — it falls back to the committed data/index_history.json.gz seed — but
# it would miss whatever the Update Indices schedule published today.
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
  # Passed explicitly rather than relying on supabase_store's "MF Data" default,
  # so the bucket this job reads history from and writes results to is visible
  # here instead of being buried in a fallback.
  SUPABASE_DATA_BUCKET: ${{ secrets.SUPABASE_DATA_BUCKET }}
  # The SIF desk. Unlike the two above this bucket is PRIVATE, so nothing can
  # read it without the service key -- including, for now, the browser. Falls
  # back to supabase_store's "SIF Data" default when the secret is unset.
  SUPABASE_SIF_BUCKET: ${{ secrets.SUPABASE_SIF_BUCKET }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The quartile rule is pinned in tests/test_quartile.py. Run it before
      # spending 10 minutes on a pipeline whose central calculation has drifted:
      # 10 of the 14 pinned bracket sizes change if the remainder goes back to
      # Q1, and every published quartile would move with it.
      - name: Check the quartile rule has not drifted
        run: python tests/test_quartile.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Verify scheme catalogue is present
        run: |
          test -f data/scheme_catalogue.json \
            || { echo "::error::data/scheme_catalogue.json is missing — run scripts/export_catalogue.py and commit it"; exit 1; }
          python -c "import json;d=json.load(open('data/scheme_catalogue.json'));print(f\"catalogue: {d['scheme_count']} schemes\")"

      # Fail fast if the bucket is unreachable.
      #
      # This matters more than it used to. NAV history is now READ from Supabase
      # and only extended by AMFI, so a run with the secrets missing does not
      # merely fail at the end — it silently decides that all 2,051 funds are
      # unpublished and bootstraps every one of them from api.mfapi.in. That
      # still produces correct data, but it takes far longer and then fails at
      # the publish step anyway. Better to stop here, before the expensive part.
      #
      # Both reads below go through supabase_store, which sends the service
      # key. That is what the pipeline itself uses, so this checks the path the
      # run actually depends on.
      - name: Check the Supabase connection
        run: |
          test -n "$SUPABASE_URL"             || { echo "::error::SUPABASE_URL secret is not set"; exit 1; }
          test -n "$SUPABASE_SERVICE_KEY"             || { echo "::error::SUPABASE_SERVICE_KEY secret is not set"; exit 1; }
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from scripts import supabase_store as sb
          if not sb.enabled():
              print(f"::error::Supabase not configured: {sb.why_disabled()}")
              sys.exit(1)
          objs = sb.list_objects("", bucket=sb.DATA_BUCKET)
          print(f"bucket {sb.DATA_BUCKET!r}: {len(objs)} object(s)")
          if not objs:
              print("::warning::bucket is empty — every fund will be "
                    "bootstrapped from api.mfapi.in, which is slow but correct")
          raw = sb.download_bytes("meta.json", bucket=sb.DATA_BUCKET)
          if raw is None and objs:
              print("::error::cannot read meta.json from the bucket")
              sys.exit(1)
          print("Supabase read/write path OK")

          # The SIF desk shares this job but not this bucket. Checked here so an
          # unreachable SIF bucket is known before the pipeline runs rather than
          # surfacing 10 minutes later; a warning, not an error, because SIF runs
          # after the MF publish and must never block it.
          sif = sb.list_objects("", bucket=sb.SIF_BUCKET)
          print(f"bucket {sb.SIF_BUCKET!r}: {len(sif)} object(s)")
          if not sif:
              print("::warning::the SIF bucket is empty - the SIF desk will "
                    "bootstrap its whole history from AMFI, which is one request")
          PY
        env:
          PYTHONIOENCODING: utf-8

      # Pick up newly launched funds. api.mfapi.in has no category information,
      # so the universe comes from AMFI's own file, which carries the SEBI
      # category in its section headers.
      #
      # continue-on-error is deliberate: the refresh is a nice-to-have, and an
      # AMFI outage must not stop the NAV update. A failure here simply means
      # today's run uses yesterday's catalogue.
      #
      # The merge is additive — funds are only ever added or updated, never
      # dropped — and it aborts on its own if AMFI returns a suspiciously short
      # file, so a bad upstream day cannot shrink the universe.
      - name: Refresh scheme catalogue (new funds)
        continue-on-error: true
        run: python scripts/export_catalogue.py --refresh
        env:
          PYTHONIOENCODING: utf-8

      # Builds a temp DB, runs the engine, writes JSON, deletes the DB.
      # Aborts before touching any JSON if the upstream data is bad or stale.
      #
      # NAV history is read back from Supabase and extended by AMFI's newest day
      # (--history-source supabase, the default). It used to re-download every
      # fund's entire history from api.mfapi.in on every run — ~3.5M rows and
      # ~2,050 requests to rebuild files that had not changed below their last
      # day. mfapi is now touched only to bootstrap a fund the bucket has never
      # held. Pass --history-source mfapi to fall back to the old behaviour.
      #
      # NOTE this makes the run depend on the bucket it publishes to: if
      # SUPABASE_* secrets are missing, every fund looks unpublished and the run
      # bootstraps all of them from mfapi, which still works but is slow.
      #
      # THE SIF DESK RUNS INSIDE THIS STEP TOO, as daily_run's step 5, after the
      # mutual fund JSON is published. One job, one clock: both desks cap their
      # newest NAV with the same previous_business_close call, so they cannot end
      # up a day apart. SIF writes only to its own bucket and its failures are
      # logged and stepped over, so it can never take down a good MF build. Pass
      # --skip-sif to leave it alone.
      - name: Run daily pipeline (Supabase + AMFI -> engine -> JSON)
        run: |
          python scripts/daily_run.py \
            --workers 12 \
            --max-staleness "${{ github.event.inputs.max_staleness || '6' }}" \
            ${{ github.event.inputs.skip_indices == 'true' && '--skip-indices' || '' }}
        env:
          PYTHONIOENCODING: utf-8

      - name: Confirm no database was left behind
        run: |
          if ls data/*.db >/dev/null 2>&1; then
            echo "::warning::a .db file was left in data/ — it will not be committed"
            ls -lh data/*.db
          else
            echo "No database stored. ✔"
          fi

      # Publish the ~2,500 data files to Supabase. This REPLACES committing them.
      #
      # Committing meant Netlify rebuilt and re-uploaded the whole site nightly:
      # ~15 min a deploy, ~450 min a month against a 300-min allowance. The site
      # reads /data/* straight from the bucket now, so the moment this finishes
      # the new data is live -- no deploy, no build minutes.
      # --prune also REMOVES bucket objects this build no longer produces. Without
      # it, every fund ever dropped from the catalogue left its nav/<code>.json
      # behind for good; the dashboard never showed them (it follows
      # manifest.json) but the bucket stopped reflecting what the site serves.
      # It refuses to run if it would delete more than 40% of the bucket.
      - name: Publish data to Supabase
        run: python scripts/publish_data.py --prune
        env:
          PYTHONIOENCODING: utf-8

      # Only the catalogue is committed, and only when it changed -- without it a
      # newly launched fund would be rediscovered every day and never persist. It
      # is not read by the frontend, so netlify.toml's ignore rule stops this
      # commit from triggering a build.
      - name: Commit the scheme catalogue if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scheme_catalogue.json
          if git diff --cached --quiet; then
            echo "Catalogue unchanged - nothing committed, so nothing to deploy."
          else
            git commit -m "chore: scheme catalogue $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # site/public/data is untracked now, so anything showing up there in git
      # status means something wrote where it should not.
      - name: Confirm no data was committed
        if: always()
        run: |
          if git status --porcelain | grep -q "site/public/data"; then
            echo "::error::site/public/data is in git status - it must stay untracked"
            exit 1
          fi
          echo "Data lives in Supabase only."

      # Same run, same closes: push the 8 Market Pulse indices to Supabase so the
      # live path and the committed copy agree instead of drifting apart.
      #
      # Placed AFTER the commit on purpose. The NAV data is the expensive part of
      # this job and must never be held hostage to a Storage hiccup; by here it is
      # already pushed. A failure below still turns the run red so it gets seen.
      #
      # Skipped rather than failed when the secrets are absent: the committed
      # indices.json is already fresh, and useIndices takes whichever source has
      # the newer close, so the site stays correct either way.
      - name: Publish Market Pulse indices to Supabase
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_KEY != '' }}
        run: python scripts/update_indices.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Note when the Supabase push was skipped
        if: ${{ env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_KEY == '' }}
        run: |
          echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_KEY not set — the 8 index"
          echo "::warning::files were not refreshed. The site falls back to the"
          echo "::warning::committed indices.json, which this run just updated."
