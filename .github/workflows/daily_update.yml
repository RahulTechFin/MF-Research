name: Daily Data Update

# Pulls the latest NAVs from api.mfapi.in, runs the calculation engine inside
# the runner, publishes the ~6 MB JSON the dashboard reads, and throws the
# database away. Nothing is stored between runs — no Release asset, no
# committed database.

# ONE RUN A DAY, ONE DEPLOY.
#
# There used to be a second cron at 08:15 IST as a catch-up. It committed too
# whenever more funds had reported overnight, so Netlify rebuilt twice a day for
# the same day's data. Now there is a single run and a single deploy; if it
# fails, re-run it from the Actions tab rather than waiting for a second cron.
#
# 23:45 IST is chosen because both upstreams are settled by then:
#   AMFI/mfapi publish the day's NAVs by ~23:00 IST  (verified: the 23:45 run
#     picked up as_of 2026-07-30 on 2026-07-30)
#   NSE closes 15:30 IST, so Yahoo's daily bar is 8h old  (verified: 2026-07-31
#     closes were available by 19:39 IST)
#
# Asking earlier risks storing an intraday index value as if it were a close.
on:
  schedule:
    # 23:45 IST = 18:15 UTC
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      max_staleness:
        description: 'Max age (days) of the newest NAV before the run aborts'
        required: false
        default: '6'
      skip_indices:
        description: 'Skip the Yahoo Finance index refresh'
        required: false
        default: 'false'

concurrency:
  group: daily-update
  cancel-in-progress: false

# The benchmark index history is pulled from Supabase Storage by
# scripts/index_store (via build_db_from_api). Without these the run still
# works — it falls back to the committed data/index_history.json.gz seed — but
# it would miss whatever the Update Indices schedule published today.
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No database download. The scheme universe lives in the committed
      # catalogue (data/scheme_catalogue.json, ~777 KB); NAVs come from the API.
      # The quartile rule is pinned in tests/test_quartile.py. Run it before
      # spending 10 minutes on a pipeline whose central calculation has drifted:
      # 10 of the 14 pinned bracket sizes change if the remainder goes back to
      # Q1, and every published quartile would move with it.
      - name: Check the quartile rule has not drifted
        run: python tests/test_quartile.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Verify scheme catalogue is present
        run: |
          test -f data/scheme_catalogue.json \
            || { echo "::error::data/scheme_catalogue.json is missing — run scripts/export_catalogue.py and commit it"; exit 1; }
          python -c "import json;d=json.load(open('data/scheme_catalogue.json'));print(f\"catalogue: {d['scheme_count']} schemes\")"

      # Pick up newly launched funds. api.mfapi.in has no category information,
      # so the universe comes from AMFI's own file, which carries the SEBI
      # category in its section headers.
      #
      # continue-on-error is deliberate: the refresh is a nice-to-have, and an
      # AMFI outage must not stop the NAV update. A failure here simply means
      # today's run uses yesterday's catalogue.
      #
      # The merge is additive — funds are only ever added or updated, never
      # dropped — and it aborts on its own if AMFI returns a suspiciously short
      # file, so a bad upstream day cannot shrink the universe.
      - name: Refresh scheme catalogue (new funds)
        continue-on-error: true
        run: python scripts/export_catalogue.py --refresh
        env:
          PYTHONIOENCODING: utf-8

      # Builds a temp DB, runs the engine, writes JSON, deletes the DB.
      # Aborts before touching any JSON if the upstream data is bad or stale.
      - name: Run daily pipeline (API -> engine -> JSON)
        run: |
          python scripts/daily_run.py \
            --workers 12 \
            --max-staleness "${{ github.event.inputs.max_staleness || '6' }}" \
            ${{ github.event.inputs.skip_indices == 'true' && '--skip-indices' || '' }}
        env:
          PYTHONIOENCODING: utf-8

      - name: Confirm no database was left behind
        run: |
          if ls data/*.db >/dev/null 2>&1; then
            echo "::warning::a .db file was left in data/ — it will not be committed"
            ls -lh data/*.db
          else
            echo "No database stored. ✔"
          fi

      # The catalogue is committed alongside the JSON: without it, a fund added
      # by the refresh step above would be rediscovered every single day and
      # never persist.
      #
      # This single commit is what triggers the single Netlify deploy, so NAVs
      # and indices go live together.
      - name: Commit and push updated JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public/data/ data/scheme_catalogue.json
          git diff --cached --quiet \
            || git commit -m "chore: data update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same run, same closes: push the 8 Market Pulse indices to Supabase so the
      # live path and the committed copy agree instead of drifting apart.
      #
      # Placed AFTER the commit on purpose. The NAV data is the expensive part of
      # this job and must never be held hostage to a Storage hiccup; by here it is
      # already pushed. A failure below still turns the run red so it gets seen.
      #
      # Skipped rather than failed when the secrets are absent: the committed
      # indices.json is already fresh, and useIndices takes whichever source has
      # the newer close, so the site stays correct either way.
      - name: Publish Market Pulse indices to Supabase
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_KEY != '' }}
        run: python scripts/update_indices.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Note when the Supabase push was skipped
        if: ${{ env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_KEY == '' }}
        run: |
          echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_KEY not set — the 8 index"
          echo "::warning::files were not refreshed. The site falls back to the"
          echo "::warning::committed indices.json, which this run just updated."
