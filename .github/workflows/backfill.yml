name: One-Time Historical Backfill

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: '2010-01-01'
      to_date:
        description: 'End date (YYYY-MM-DD)'
        required: false
        default: ''
      skip_repair:
        description: 'Skip gap repair after backfill'
        required: false
        default: 'false'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360    # 6 hours max (backfill is slow)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create directories
        run: mkdir -p data site/public/data

      - name: Initialise database schema + seed data
        run: python scripts/init_db.py

      - name: Backfill AMFI NAVs (2010 → today)
        run: |
          TO_ARG=""
          if [ -n "${{ github.event.inputs.to_date }}" ]; then
            TO_ARG="--to ${{ github.event.inputs.to_date }}"
          fi
          python scripts/backfill_amfi.py --from ${{ github.event.inputs.from_date }} $TO_ARG

      - name: Run gap repair
        if: github.event.inputs.skip_repair != 'true'
        run: python scripts/backfill_amfi.py --repair

      - name: Backfill Yahoo Finance index data
        run: python scripts/backfill_indices.py

      - name: Build initial JSON outputs
        run: python scripts/build_json.py

      - name: Upload database to GitHub Release
        run: |
          gh release create database --notes "Database storage for daily pipeline" || true
          gh release upload database data/mf_research.db --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit completed database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public/data/
          git diff --cached --quiet || git commit -m "feat: initial backfill complete $(date -u '+%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
